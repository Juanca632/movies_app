# Per-client request limits (this file is included in nginx's http block).
# Behind another proxy or CDN, $binary_remote_addr is that proxy: configure
# set_real_ip_from/real_ip_header for it, or every visitor shares one bucket.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# OMDb's free plan allows 1000 requests a day for the whole site.
limit_req_zone $binary_remote_addr zone=acclaim:10m rate=12r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Declared here only: an add_header inside a location would drop all of these.
  # connect-src 'self' assumes the API is served from this origin (/api/v1); if
  # VITE_API_URL points elsewhere, add that origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https://image.tmdb.org data:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # YouTube embeds need at least the origin as referrer.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  limit_req_status 429;

  location /api/v1/acclaim/ {
    limit_req zone=acclaim burst=6 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API requests go to the backend container (see docker-compose.yml)
  location /api/ {
    # A page load fires ~10 requests at once, hence the burst.
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}
