<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0c" />
    <!-- Installed on iOS: full screen with a dark status bar, named like the manifest. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MoviesApp" />
    <meta
      name="description"
      content="Discover movies, TV shows and actors: what's in theaters, what's trending and where to watch it."
    />
    <!-- Default link preview; backend/app/services/share.py serves per-title ones to crawlers. -->
    <meta property="og:site_name" content="MoviesApp" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MoviesApp" />
    <meta
      property="og:description"
      content="Discover movies, TV shows and actors: what's in theaters, what's trending and where to watch it."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap"
    />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <!-- Wakes the backend (a serverless function) while the scripts download; main.tsx reads it. -->
    <link rel="preload" href="/api/v1/health" as="fetch" crossorigin="anonymous" />
    <title>MoviesApp</title>
  </head>
  <body style="margin: 0; background: #0a0a0c">
    <!--
      Splash, painted before any script runs; main.tsx fades it out once the first page and the
      images on screen are ready. The CSP allows no inline <style>, hence style attributes for the
      layout; the motion (.splash-*) is in index.css, as CSS animations of transform and opacity:
      they run off the main thread and start at first paint, while SVG <animate> waited for the
      load event (a cold backend delays it) and then stuttered as the app started.
    -->
    <div
      id="splash"
      aria-hidden="true"
      style="position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0a0a0c; transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1)"
    >
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
        <div class="splash-logo" style="width: 72px; height: 72px">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <rect width="72" height="72" rx="18" fill="#f5b83d" />
            <path d="M28 22.5v27l21.5-13.5z" fill="#0a0a0c" />
          </svg>
        </div>
        <div style="width: 40px; height: 3px; overflow: hidden; border-radius: 1.5px; background: rgba(255, 255, 255, 0.08)">
          <div class="splash-bar" style="width: 14px; height: 3px; border-radius: 1.5px; background: #f5b83d"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
